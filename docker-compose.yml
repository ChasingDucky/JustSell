version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: cardsky-postgres
    environment:
      POSTGRES_DB: cardsky
      POSTGRES_USER: cardsky_user
      POSTGRES_PASSWORD: cardsky_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - cardsky-network

  redis:
    image: redis:7-alpine
    container_name: cardsky-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - cardsky-network
    command: redis-server --appendonly yes

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cardsky-backend
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://cardsky_user:cardsky_password@postgres:5432/cardsky
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - cardsky-network
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cardsky-frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:3001/api
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - cardsky-network
    stdin_open: true
    tty: true

  nginx:
    image: nginx:alpine
    container_name: cardsky-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - cardsky-network

volumes:
  postgres_data:
  redis_data:

networks:
  cardsky-network:
    driver: bridge
